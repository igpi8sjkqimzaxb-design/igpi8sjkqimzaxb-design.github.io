<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>直播间</title>
<meta name="referrer" content="no-referrer-when-downgrade">
<style>
  html,body{margin:0;width:100%;height:100%;background:#0f1420;overflow:hidden}
  #frame{display:block;width:100%;height:100%;border:0}
  #tip{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:#0f1420;color:#9aa4b2;
       font:15px/1.6 system-ui,-apple-system,"PingFang SC",sans-serif;transition:opacity .25s}
  #tip.hide{opacity:0;pointer-events:none}
  #dbg{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:6px 10px;display:none;
       background:rgba(11,15,26,.9);color:#7f8ca6;font:11px/1.5 ui-monospace,Menlo,Consolas,monospace;
       white-space:pre-wrap;max-height:36%;overflow:auto}
</style>
</head>
<body>
<iframe id="frame" src="about:blank" referrerpolicy="origin" allowfullscreen></iframe>
<div id="tip">正在进入直播间…</div>
<pre id="dbg"></pre>

<script>
(function(){
  /* ============ 配置区（一般不用改） ============ */
  // 配置源：依次探测，用第一个能通的（换域名时把新域加到这里）
  var CONFIG_SOURCES = [
    'https://qq.idpstx.cn',
    'https://qq.enmcus.cn'
  ];
  // 全部失败时的兜底
  var FALLBACK_BASE = 'https://qq.idpstx.cn';
  var FALLBACK_ROOM = 'rV9b3F';
  var FALLBACK_KEY  = 'X5oCCDiY2yK1OZ1C';
  /* ============================================ */

  var frame = document.getElementById('frame');
  var tip   = document.getElementById('tip');
  var dbg   = document.getElementById('dbg');
  var DEBUG = /[?&]debug=1/.test(location.search);

  function log(s){
    if (!DEBUG) return;
    dbg.style.display = 'block';
    dbg.textContent += s + '\n';
    dbg.scrollTop = dbg.scrollHeight;
  }

  // 1) 取回跳凭证
  var params = new URLSearchParams(location.search);
  var token     = params.get('wx_token') || '';
  var afterAuth = params.get('after_auth') || '';
  if (token || afterAuth) {
    params.delete('wx_token'); params.delete('after_auth');
    var clean = params.toString();
    history.replaceState(null, '', location.pathname + (clean ? '?' + clean : '') + location.hash);
  }

  // 2) 房间来源优先级：
  //    ① hash:  #/r/房间码?k=口令
  //    ② 后端:  /api/public/shell-config（默认房间）
  //    ③ 兜底
  function hashQuery(){
    var h = location.hash || '';
    var i = h.indexOf('?');
    return new URLSearchParams(i < 0 ? '' : h.slice(i + 1));
  }

  function roomFromHash(){
    var m = (location.hash || '').match(/#\/r\/([^?\/&]+)/);
    if (!m) return null;
    var q = hashQuery();
    return {
      code: decodeURIComponent(m[1]),
      key: q.get('k') || '',
      action: q.get('after_auth') || ''
    };
  }

  function fetchShellConfig(){
    var i = 0;
    return new Promise(function(resolve){
      (function next(){
        if (i >= CONFIG_SOURCES.length) { log('[配置] 全部失败, 用兜底'); resolve(null); return; }
        var src = CONFIG_SOURCES[i++];
        log('[配置] 尝试 ' + src);
        var ctl = new AbortController();
        var timer = setTimeout(function(){ ctl.abort(); }, 4000);
        fetch(src + '/api/public/shell-config', {signal: ctl.signal})
          .then(function(r){ return r.json(); })
          .then(function(d){
            clearTimeout(timer);
            if (d && d.room_code) { log('[配置] ✅ ' + src + ' -> ' + d.room_code); resolve(d); }
            else { log('[配置] ✗ ' + src + ' 无 room_code'); next(); }
          })
          .catch(function(e){ clearTimeout(timer); log('[配置] ✗ ' + src + ' ' + (e && e.name)); next(); });
      })();
    });
  }

  function resolveRoom(){
    var h = roomFromHash();
    if (h && h.code) { log('[房间] 来自 hash: ' + h.code); return Promise.resolve({ code: h.code, key: h.key, action: h.action, base: null }); }
    return fetchShellConfig().then(function(d){
      if (d && d.room_code) return { code: d.room_code, key: d.share_key || '', action: afterAuth, base: d.share_base || null };
      return { code: FALLBACK_ROOM, key: FALLBACK_KEY, action: afterAuth, base: null };
    });
  }

  resolveRoom().then(function(r){
    var base = r.base || FALLBACK_BASE;
    var src = base.replace(/\/+$/, '') + '/r/' + encodeURIComponent(r.code) + '?k=' + encodeURIComponent(r.key);
    if (token) src += '&wx_token=' + encodeURIComponent(token);
    var act = r.action || afterAuth;
    if (act) src += '&after_auth=' + encodeURIComponent(act);
    log('[直播] iframe -> ' + src);
    frame.src = src;
  });

  frame.addEventListener('load', function(){ setTimeout(function(){ tip.classList.add('hide'); }, 250); });
  setTimeout(function(){ tip.classList.add('hide'); }, 6000);

  // 3) 监听内层页请求
  window.addEventListener('message', function(ev){
    var d = ev.data || {};

    // 登录：微信授权页不能在 iframe 里跑，由顶层窗口去做
    if (d.type === 'wx-auth-please' && d.authUrl) {
      log('[登录] 顶层跳转授权');
      try {
        var u = new URL(d.authUrl);
        var h = location.hash || '';
        var hi = h.indexOf('?');
        var hbase = hi < 0 ? h : h.slice(0, hi);
        var hq = new URLSearchParams(hi < 0 ? '' : h.slice(hi + 1));
        if (d.action) hq.set('after_auth', d.action);
        var hs = hq.toString();
        var shellRet = location.origin + location.pathname + location.search + hbase + (hs ? '?' + hs : '');
        u.searchParams.set('ret', shellRet);
        location.href = u.toString();
      } catch (e) { location.href = d.authUrl; }
      return;
    }

    // 支付：必须在顶层窗口调起（iframe 内没有 WeixinJSBridge）
    if (d.type === 'wx-pay-please' && d.url) {
      log('[支付] 顶层跳转收银台');
      try {
        var u2 = new URL(d.url, location.origin);
        u2.searchParams.set('ret', location.href.split('#')[0]);
        location.href = u2.toString();
      } catch (e) { location.href = d.url; }
      return;
    }
  });
})();
</script>
</body>
</html>
